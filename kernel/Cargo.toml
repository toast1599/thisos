[package]
name = "thisos-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false
bench = false

[[bin]]
name = "thisos-kernel"
test = false
bench = false

[dependencies]
log = "0.4"
spin = { version = "0.12", default-features = false, features = ["mutex", "spin_mutex"] }
thisos-console.workspace = true
thisos-frames.workspace = true
thisos-hal.workspace = true

[target.'cfg(target_arch = "x86_64")'.dependencies]
thisos-arch-x86_64.workspace = true

[target.'cfg(target_arch = "aarch64")'.dependencies]
thisos-arch-aarch64.workspace = true

[lints]
workspace = true
