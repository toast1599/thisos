[workspace]
resolver = "3"

[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/toast1599/thisos"
publish = false

[dependencies]
anyhow = "1"
bootloader = { version = "0.11", default-features = false, features = ["uefi"] }
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
ovmf-prebuilt = "0.2"
serde_json = "1"
