[workspace]
resolver = "3"

[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/toast1599/thisos"
publish = false

# The banned-pattern lints from the root workspace's table, which xtask,
# a workspace of its own, doesn't inherit.
[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
mem_forget = "deny"

[dependencies]
anyhow = "1"
bootloader = { version = "0.11", default-features = false, features = ["uefi"] }
clap = { version = "4", features = ["derive"] }
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
fontdue = "0.9"
gpt = "3.1"
lzma-rs = "0.3"
ovmf-prebuilt = "0.2"
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
