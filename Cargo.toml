[workspace]
resolver = "3"
members = ["kernel", "hal", "arch/x86_64", "arch/aarch64", "lib/console", "lib/frames"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/toast1599/thisos"
publish = false

[workspace.dependencies]
thisos-hal = { path = "hal" }
thisos-arch-x86_64 = { path = "arch/x86_64" }
thisos-arch-aarch64 = { path = "arch/aarch64" }
thisos-console = { path = "lib/console" }
thisos-frames = { path = "lib/frames" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
as_conversions = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
mem_forget = "deny"
disallowed_methods = "deny"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
debug = true
